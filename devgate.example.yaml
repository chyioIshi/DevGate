error_responses:
  404:
    body: '{"error":"route not found"}'
    headers:
      Content-Type: application/json
  405:
    body: '{"error":"method not allowed"}'
    headers:
      Content-Type: application/json
  500:
    body: '{"error":"internal server error"}'
    headers:
      Content-Type: application/json

routes:
  - name: users
    protocol: http
    path_prefix: /api/users
    header_matches:
      - name: X-Environment
        exact: production
    priority: 100
    upstream_url: http://users-service:8080
    request_headers:
      set:
        X-Gateway: DevGate
      remove:
        - X-Legacy-Header
    response_headers:
      set:
        X-Gateway-Response: DevGate
      remove:
        - X-Legacy-Response-Header
    error_responses:
      429:
        body: '{"error":"rate limit exceeded"}'
        headers:
          Content-Type: application/json
      502:
        body: '{"error":"upstream unavailable"}'
        headers:
          Content-Type: application/json
    rate_limit:
      requests_per_second: 100
      burst: 200
    strip_path_prefix: true
    request_timeout: 5s
    max_request_body_bytes: 10485760

  - name: status
    protocol: http
    path_exact: /api/status
    upstream_url: http://status-service:8080

  - name: deprecated-api
    path_prefix: /api/v1
    direct_response:
      status: 410
      body: API v1 is no longer available
    response_headers:
      set:
        Content-Type: text/plain; charset=utf-8

  - name: legacy-api
    path_exact: /legacy
    redirect:
      status: 308
      location: /api/v2

  - name: fallback
    protocol: http
    path_prefix: /
    upstream_url: http://frontend-service:8080
