version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - canonicalheader
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - govet
    - ineffassign
    - lll
    - loggercheck
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - promlinter
    - sloglint
    - staticcheck
    - unconvert
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - noctx
      - linters:
          - staticcheck
        text: "QF1001:"
  settings:
    lll:
      line-length: 120
      tab-width: 1

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod
  modules-download-mode: readonly
